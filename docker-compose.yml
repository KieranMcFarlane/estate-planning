services:
  estate-postgres:
    image: postgres:16-alpine
    container_name: estate-planning-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ESTATE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ESTATE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ESTATE_POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - estate-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ESTATE_POSTGRES_USER} -d ${ESTATE_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  estate-postgres-data:
